name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses & Write Local Properties
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Prepare Capacitor Android Assets & Config
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          node -e "const fs = require('fs'); const cfg = { appId: 'dev.presences.app', appName: 'Presences', webDir: 'dist', server: { url: 'https://presences.dev', cleartext: true, androidScheme: 'https' }, android: { allowMixedContent: true, captureInput: true, webContentsDebuggingEnabled: false } }; fs.writeFileSync('android/app/src/main/assets/capacitor.config.json', JSON.stringify(cfg, null, 2));"
          echo "// DO NOT EDIT THIS FILE!" > android/capacitor.settings.gradle
          echo "include ':capacitor-android'" >> android/capacitor.settings.gradle
          echo "project(':capacitor-android').projectDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')" >> android/capacitor.settings.gradle

      - name: Ensure Gradlew Executable
        run: chmod +x android/gradlew

      - name: Generate Production Release Keystore (if not exists)
        run: |
          cd android/app
          if [ ! -f "presences-release-key.jks" ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -noprompt -v \
              -keystore presences-release-key.jks \
              -storetype JKS \
              -alias presences \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass presences123 \
              -keypass presences123 \
              -dname "CN=Presences, OU=Mobile, O=Presences Dev, L=San Francisco, ST=CA, C=US" || true
            ls -la presences-release-key.jks || true
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-debug.log || {
            echo "### ❌ Gradle Debug Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 ../gradle-debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build Android Release APK & App Bundle
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-release.log || true

      - name: Upload Gradle Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Logs
          path: |
            gradle-debug.log
            gradle-release.log

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          echo "Scanning build outputs:"
          find android/app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) || true

          RELEASE_APK=$(find android/app/build/outputs/apk -name "*release*.apk" 2>/dev/null | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk -name "*debug*.apk" 2>/dev/null | head -n 1)
          ANY_APK=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          RELEASE_AAB=$(find android/app/build/outputs/ -name "*.aab" 2>/dev/null | head -n 1)

          TARGET_APK="${RELEASE_APK:-${DEBUG_APK:-$ANY_APK}}"
          if [ -n "$TARGET_APK" ] && [ -f "$TARGET_APK" ]; then
            echo "Copying primary APK: $TARGET_APK"
            cp -v "$TARGET_APK" release-artifacts/Presences-latest.apk
            cp -v "$TARGET_APK" release-artifacts/Presences-Release-v2.4.2.apk
          fi

          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Copying debug APK: $DEBUG_APK"
            cp -v "$DEBUG_APK" release-artifacts/Presences-Debug-v2.4.2.apk
          fi

          if [ -n "$RELEASE_AAB" ] && [ -f "$RELEASE_AAB" ]; then
            echo "Copying release bundle: $RELEASE_AAB"
            cp -v "$RELEASE_AAB" release-artifacts/Presences-v2.4.2.aab
          fi

          echo "Final release artifacts content:"
          ls -la release-artifacts/

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: Presences-Android-Build
          path: release-artifacts/*
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Presences Smart School App (v2.4.2 - Production Release)"
          body: |
            ### 📱 Presences Smart School Native Android App (v2.4.2)
            
            Official production native Android build for Presences Smart School (`dev.presences.app`).
            
            #### 📦 Included Artifacts:
            - **`Presences-latest.apk`**: Direct production release APK. Download and install directly on any Android device (Android 7.0+).
            - **`Presences-Release-v2.4.2.apk`**: Signed release APK for archival and direct side-loading.
            - **`Presences-v2.4.2.aab`**: Google Play Store App Bundle ready for Play Console upload.
            - **`Presences-Debug-v2.4.2.apk`**: Debug build for development and logcat inspection.
            
            #### ⚡ Key Features in this Release:
            - **Full Native Package**: `dev.presences.app` with hardware camera, WebGL GPU acceleration, and wake lock.
            - **4 Native Home Screen Widgets**: Attendance Glance, Quick Actions, Live Period, and Campus Gate pass.
            - **Direct Cloud Architecture**: Instant real-time attendance verification directly with Supabase.
            - **Verified App Links**: Deep links support for `https://presences.dev/*` and `presences://*`.
            - **Direct Web & Native Sync**: Instant updates pushed seamlessly across web and Android.
            
            #### 🚀 Installation:
            1. Download **`Presences-latest.apk`** below.
            2. Open the file on your Android device and tap **Install**.
          draft: false
          prerelease: false
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
