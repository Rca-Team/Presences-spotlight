name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Presences-latest.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Presences-v2.4.2.apk

      - name: Upload APK Artifact to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: Presences-Android-APK
          path: release-artifacts/Presences-latest.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Presences Smart School App (Continuous Latest Build)"
          body: |
            ### 📱 Presences Smart School Native Android App
            
            This is the official compiled APK build generated automatically from the `main` branch.
            
            - **Direct 1-Tap Installation**: If installing via mobile browser on https://presences.dev, use the Direct Install button to get automatic background updates on every deploy!
            - **Offline Verification**: Works offline with edge facial recognition vectors.
            - **Native Widgets**: Home Screen attendance glance and quick timetable widgets included.
            
            **Installation Instructions:**
            1. Download `Presences-latest.apk` below.
            2. Tap the downloaded file and select **Install**. (Enable "Install unknown apps" if prompted).
          draft: false
          prerelease: false
          files: |
            release-artifacts/Presences-latest.apk
            release-artifacts/Presences-v2.4.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
